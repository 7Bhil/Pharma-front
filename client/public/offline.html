<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mode Hors-Ligne — PharmaConnect</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
      }
      .offline-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        max-width: 440px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon-box {
        width: 64px;
        height: 64px;
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border-radius: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .badge {
        display: inline-block;
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .btn {
        background: #059669;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 0.75rem;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
        display: inline-block;
      }
      .btn:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="icon-box">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <div class="badge">Connexion Interrompue</div>
      <h1>Vous êtes hors-ligne</h1>
      <p>
        PharmaConnect conserve vos ordonnances et pass coupe-file déjà consultés en mémoire sécurisée locale. Vérifiez votre connexion internet pour réactualiser les stocks d officines en direct.
      </p>
      <button class="btn" onclick="window.location.reload()">Réessayer la connexion</button>
    </div>
  </body>
</html>
